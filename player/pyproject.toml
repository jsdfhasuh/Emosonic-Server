[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "emosonic-player"
version = "0.1.0"
description = "Core-only EmoSonic headless player and local CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "python-socketio[asyncio_client]==5.17.0",
  "aiohttp==3.14.5",
  # Resolved runtime closure, pinned to prevent resolver drift.
  "aiohappyeyeballs==2.7.1",
  "aiosignal==1.4.0",
  "attrs==26.1.0",
  "bidict==0.24.1",
  "frozenlist==1.8.0",
  "h11==0.16.0",
  "idna==3.20",
  "multidict==7.2.1",
  "propcache==0.5.4",
  "python-engineio==4.15.1",
  "simple-websocket==1.1.0",
  "typing_extensions==4.16.0",
  "wsproto==1.3.2",
  "yarl==1.25.1",
]

[project.scripts]
emosonic-playerd = "emosonic_player.main:main"
emosonic = "emosonic_player.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
