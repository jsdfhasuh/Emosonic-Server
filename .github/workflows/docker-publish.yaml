# TEST branch only. This intentionally replaces the inherited all-branch registry publisher.
name: TEST Server Build

on:
  push:
    branches: [test/server-follow-actual-rate-20261025]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-server-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_COMMIT: 5adc23da173c5f20188d79aafe8fcc1e656eb38a
  TEST_IMAGE: emosonic-server:test-0.8.0-5adc23da-linux-amd64

jobs:
  test-build:
    if: github.ref == 'refs/heads/test/server-follow-actual-rate-20261025'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout TEST build tools
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: test-tools
          persist-credentials: false

      - name: Checkout exact product source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          path: product-source
          persist-credentials: false

      - name: Export clean product build context
        run: |
          test "$(git -C product-source rev-parse HEAD)" = "$SOURCE_COMMIT"
          mkdir -p build-context package-context bundle/checks
          git -C product-source archive HEAD | tar -x -C build-context
          git -C product-source archive HEAD | tar -x -C package-context
          test ! -e build-context/.git
          test ! -e build-context/supysonic.conf
          cp test-tools/docs/server-test-build.md bundle/README-TEST.md
          cp test-tools/config.server-test.sample bundle/
          cp test-tools/script/verify_server_test_build.py bundle/

      - name: Set up Python for existing test suite
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install existing test and build dependencies
        working-directory: product-source
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ci-requirements.txt

      - name: Run original test commands
        working-directory: product-source
        run: |
          set -o pipefail
          coverage run -m unittest 2>&1 | tee ../bundle/checks/unittest.log
          coverage run -a -m unittest tests.net.suite 2>&1 | tee ../bundle/checks/network-tests.log
          coverage report -m | tee ../bundle/checks/coverage.txt

      - name: Build and verify wheel and source distribution
        working-directory: package-context
        env:
          EMO_SERVER_BUILD_COMMIT: ${{ env.SOURCE_COMMIT }}
        run: |
          set -o pipefail
          python -m build 2>&1 | tee ../bundle/checks/package-build.log
          python ../test-tools/script/verify_server_test_build.py packages dist
          for kind in wheel sdist; do
            target="$RUNNER_TEMP/emosonic-test-$kind"
            if [ "$kind" = wheel ]; then package=(dist/*.whl); else package=(dist/*.tar.gz); fi
            python -m pip install --no-deps --target "$target" "${package[@]}"
            (
              cd "$RUNNER_TEMP"
              PYTHONPATH="$target" EMOSONIC_EXPECTED_PACKAGE_ROOT="$target" \
                python "$GITHUB_WORKSPACE/test-tools/script/verify_server_test_build.py" metadata
            ) > "../bundle/checks/$kind-metadata.json"
          done
          cp dist/*.whl dist/*.tar.gz ../bundle/

      - name: Build TEST Docker image from unchanged product Dockerfile
        run: |
          set -o pipefail
          docker build --platform linux/amd64 \
            --build-arg "SERVER_BUILD_COMMIT=$SOURCE_COMMIT" \
            -t "$TEST_IMAGE" build-context 2>&1 | tee bundle/checks/docker-build.log
          test "$(docker image inspect "$TEST_IMAGE" --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
          test "$(docker image inspect "$TEST_IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$SOURCE_COMMIT"
          docker run --rm -i --network none --read-only --tmpfs /tmp \
            --entrypoint python "$TEST_IMAGE" - metadata \
            < test-tools/script/verify_server_test_build.py > bundle/checks/docker-metadata.json

      - name: Start isolated web-only TEST server and verify registration
        run: |
          docker run -d --name emosonic-server-test-smoke --network none \
            --read-only --tmpfs /tmp:rw,nosuid,nodev,size=256m \
            --mount "type=bind,src=$GITHUB_WORKSPACE/test-tools/config.server-test.sample,dst=/app/supysonic.conf,readonly" \
            --entrypoint supysonic-server "$TEST_IMAGE" -S gevent -h 127.0.0.1 -p 5000
          docker exec -i emosonic-server-test-smoke python - smoke \
            < test-tools/script/verify_server_test_build.py > bundle/checks/runtime-smoke.json

      - name: Stop disposable TEST server
        if: always()
        run: |
          if docker container inspect emosonic-server-test-smoke > /dev/null 2>&1; then
            docker logs emosonic-server-test-smoke > bundle/checks/runtime.log 2>&1
            docker rm -f emosonic-server-test-smoke
          fi

      - name: Export image archive and source/run information
        run: |
          docker save "$TEST_IMAGE" | gzip -1 > bundle/emosonic-server-TEST-0.8.0-5adc23da-linux-amd64.docker.tar.gz
          docker image inspect "$TEST_IMAGE" --format '{{json .}}' > bundle/checks/docker-image.json
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          metadata = {
              "purpose": "TEST only; no release, registry push or deployment",
              "sourceRepository": "https://github.com/jsdfhasuh/Emosonic-Server",
              "sourceCommit": os.environ["SOURCE_COMMIT"],
              "buildToolsCommit": os.environ["GITHUB_SHA"],
              "branch": os.environ["GITHUB_REF_NAME"],
              "runUrl": f'{os.environ["GITHUB_SERVER_URL"]}/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}',
              "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "builtAtUtc": datetime.now(timezone.utc).isoformat(),
              "imageTag": os.environ["TEST_IMAGE"],
              "platform": "linux/amd64",
              "packageVersion": "0.8.0",
              "retentionDays": 7,
              "limitations": ["Not a formal release", "No real music library or production database tested", "No full client playback or multi-device end-to-end test"],
          }
          Path("bundle/BUILD-INFO.json").write_text(json.dumps(metadata, indent=2) + "\n")
          PY
          (cd bundle && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)

      - name: Upload usable TEST bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Emosonic-Server-TEST-0.8.0-5adc23da-linux-amd64-${{ github.run_id }}
          path: bundle/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload diagnostics if build failed
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Emosonic-Server-TEST-diagnostics-${{ github.run_id }}
          path: bundle/checks/
          if-no-files-found: warn
          retention-days: 7
